<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil Académico - Cinthya González Hernández</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
body {
background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
color: #f8fafc;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}
.card {
background-color: #1e293b;
border: 1px solid #334155;
border-radius: 16px;
max-width: 500px;
width: 100%;
padding: 32px;
box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
}
.header {
border-bottom: 2px solid #0284c7;
padding-bottom: 16px;
margin-bottom: 24px;
}
.institution {
color: #38bdf8;
font-size: 0.85rem;
font-weight: 700;
letter-spacing: 1.5px;
text-transform: uppercase;
}
.title {
font-size: 1.5rem;
font-weight: 700;
color: #ffffff;
margin-top: 4px;
}
.info-group {
margin-bottom: 16px;
}
.label {
font-size: 0.8rem;
color: #94a3b8;
text-transform: uppercase;
letter-spacing: 0.5px;
}
.value {
font-size: 1.1rem;
color: #f1f5f9;
font-weight: 500;
margin-top: 2px;
}
.badge {
display: inline-block;
background-color: rgba(56, 189, 248, 0.1);
color: #38bdf8;
border: 1px solid rgba(56, 189, 248, 0.3);
padding: 4px 12px;
border-radius: 20px;
font-size: 0.9rem;
font-weight: 600;
}
.message-box {
margin-top: 24px;
background-color: #0f172a;
border-left: 4px solid #38bdf8;
padding: 16px;
border-radius: 0 8px 8px 0;
}
.message-box p {
font-style: italic;
color: #cbd5e1;
line-height: 1.6;
}
</style>
</head>
<body>
<div class="card">
<div class="header">
<div class="institution">UNITEC</div>
<div class="title">Cinthya González Hernández</div>
</div>
<div class="info-group">
<div class="label">Carrera</div>
<div class="value">Licenciatura en Ingeniería en Sistemas en Software</div>
</div>
<div class="info-group">
<div class="label">Cuatrimestre</div>
<div class="value"><span class="badge">9° Cuatrimestre</span></div>
</div>
<div class="message-box">
<div class="label" style="margin-bottom: 6px;">Reflexión</div>
<p>"Es una buena carrera pero así como es bonita también es un difícil pero vale la pena."</p>
</div>
</div>
</body>
</html>
